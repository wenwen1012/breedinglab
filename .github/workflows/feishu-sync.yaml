name: Sync Feishu document and publish site

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feishu-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      
      - name: Install feishu2md
        run: |
          curl -fL --retry 3 \
            https://github.com/Wsine/feishu2md/releases/download/v2.4.5/feishu2md-v2.4.5-linux-amd64.tar.gz \
            -o /tmp/feishu2md.tar.gz

          mkdir -p /tmp/feishu2md
          tar -xzf /tmp/feishu2md.tar.gz -C /tmp/feishu2md

          BIN="$(find /tmp/feishu2md -type f -name feishu2md -print -quit)"
          test -n "$BIN"
          sudo install "$BIN" /usr/local/bin/feishu2md

          feishu2md --version


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install sync script dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Sync the single Feishu document
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: bash scripts/sync-feishu.sh

      - name: Commit generated documentation when changed
        run: |
          git config user.name "feishu-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs
          if git diff --cached --quiet; then
            echo "No document changes; skipping commit."
          else
            git commit -m "docs: sync from Feishu"
            git push
          fi

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
